id = "zed.hop"
name = "Hop"
version = "0.3.0"
min_herdr_version = "0.8.2"
description = "Vimium-style hint labels, shown right in the Herdr sidebar, to jump to any space, agent, pane, or tab. No extra window, never steals terminal focus."
platforms = ["linux", "macos"]

# Sidebar mode: labels appear next to every space and agent row in the sidebar,
# a tiny HUD popup captures the key. The action only asks Herdr to open the
# popup, so no interpreter starts before the popup itself.
[[actions]]
id = "open"
title = "Hop: hint jump (sidebar)"
contexts = ["workspace", "global"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"${HERDR_PLUGIN_ID:-zed.hop}\" --entrypoint hop"]

# List mode: one big popup with a pane mini-map and full tab/agent lists.
[[actions]]
id = "open-list"
title = "Hop: hint jump (list popup)"
contexts = ["workspace", "global"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"${HERDR_PLUGIN_ID:-zed.hop}\" --entrypoint list"]

[[actions]]
id = "back"
title = "Hop: jump back to previous pane"
contexts = ["workspace", "global"]
command = ["./hop", "--back"]

[[panes]]
id = "hop"
title = "Hop"
placement = "popup"
width = 64
height = 5
command = ["./hop"]

[[panes]]
id = "list"
title = "Hop list"
placement = "popup"
width = "80%"
height = "70%"
command = ["./hop", "--list"]
